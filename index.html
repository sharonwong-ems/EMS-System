<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EMS System — coming soon</title>
  <style>
    :root { --bg: #f6f7f9; --text: #1d2433; --muted: #6b7280; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1420; --text: #e8ebf2; --muted: #9aa3b2; --accent: #60a5fa; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
    }
    h1 { font-size: clamp(1.8rem, 6vw, 3rem); margin: 0 0 12px; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>EMS System <span>— coming soon</span></h1>
    <p>We are building something new. Please check back later.</p>
  </main>
</body>
</html>
